name: build-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Build package
        shell: pwsh
        run: ./tools/package_release.ps1

      - name: Verify package
        shell: pwsh
        run: ./tools/verify_release.ps1

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: QingPricePOE2-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256.txt
