name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Build login PoC with locked restore
        shell: pwsh
        run: ./tools/build_login.ps1

      - name: Ensure NuGet lock file is unchanged
        shell: pwsh
        run: git diff --exit-code -- login/QingPriceLogin/packages.lock.json

      - name: Test login PoC policy
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./login/QingPriceLogin/bin/Release/net48/POE2PriceLogin.exe -ArgumentList --self-test -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Package release for integration checks
        shell: pwsh
        run: ./tools/package_release.ps1 -SkipBuild

      - name: Verify release package and runtime prerequisites
        shell: pwsh
        run: ./tools/verify_release.ps1
