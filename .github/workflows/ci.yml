name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Build login PoC
        run: dotnet build login/QingPriceLogin/QingPriceLogin.csproj -c Release

      - name: Test login PoC policy
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./login/QingPriceLogin/bin/Release/net48/QingPriceLogin.exe -ArgumentList --self-test -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
